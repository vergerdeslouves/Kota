<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F1EEE5">
<title>Le kota – Verger des Louves</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  color-scheme: light;
  --char:#F1EEE5;      /* crème du site */
  --char-2:#FBF9F4;
  --char-3:#E7E3D7;
  --birch:#12201D;     /* vert sapin du lotus */
  --birch-dim:#5A5E58;
  --ember:#A0BD51;     /* vert du logo */
  --ember-deep:#6E8A2C;
  --wine:#7A2638;
  --cheese:#E9C766;
  --line:rgba(18,32,29,.12);
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --ui:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--char);
  background-image:radial-gradient(120% 70% at 50% 115%, rgba(160,189,81,.20), transparent 60%);
  color:var(--birch);font-family:var(--ui);font-size:18px;line-height:1.4;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
[hidden]{display:none!important}

.app{height:100%;display:flex;flex-direction:column;padding:clamp(14px,2.6vw,28px);gap:clamp(12px,2vw,20px)}

header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{min-width:0;display:flex;align-items:center;gap:clamp(12px,2vw,20px)}
.brand img{width:clamp(60px,8vw,96px);height:auto;flex-shrink:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,5vw,56px);line-height:1;margin:0;letter-spacing:-.01em}
.brand p{margin:.35em 0 0;color:var(--birch-dim);font-size:clamp(15px,1.7vw,19px)}
.head-side{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.clock{font-family:var(--display);font-size:clamp(24px,3.2vw,36px);color:var(--ember-deep);min-width:3.2em;text-align:right}
.pill{border:1px solid var(--line);border-radius:999px;padding:12px 18px;font-weight:600;background:var(--char-2)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--char-2);padding:4px}
.langs button{padding:8px 13px;border-radius:999px;font-weight:700;font-size:15px;color:var(--birch-dim)}
.langs button.sel{background:var(--birch);color:var(--char)}

/* Tuiles */
.grid{flex:1;min-height:0;display:grid;gap:clamp(10px,1.6vw,16px);
  grid-template-columns:1.35fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.tile{position:relative;text-align:left;border-radius:22px;padding:clamp(16px,2vw,24px);
  background:var(--char-2);border:1px solid var(--line);box-shadow:0 1px 0 rgba(18,32,29,.06);
  display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s ease;min-height:0}
.tile:active{transform:scale(.975)}
.tile svg{width:clamp(30px,3.6vw,42px);height:auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.3vw,30px);line-height:1.05;margin:0}
.tile span{display:block;color:var(--birch-dim);font-size:clamp(13px,1.35vw,16px);margin-top:.35em}
.t-manque{grid-column:1;grid-row:1 / span 2;background:var(--ember);border-color:transparent;
  background-image:radial-gradient(90% 60% at 20% 100%, rgba(232,244,196,.7), transparent 70%)}
.t-manque h2{font-size:clamp(30px,4.2vw,52px)}
.t-manque span{color:#2E4318}
.t-raclette{grid-column:1;grid-row:2;background:var(--cheese);border-color:transparent}
.t-raclette span{color:#4A3A10;font-weight:600}
.grid.has-raclette .t-manque{grid-row:1}
.t-addition{grid-column:2;grid-row:1 / span 2;background:var(--wine);color:#F6E3E7;border-color:transparent}
.t-addition span{color:#E8C3CB}

@media (orientation:portrait){
  .grid{grid-template-columns:1fr 1fr;grid-template-rows:none;grid-auto-rows:1fr}
  .t-manque,.t-raclette{grid-column:1 / span 2;grid-row:auto}
  .t-addition{grid-column:auto;grid-row:auto}
  .grid.has-raclette .t-manque{grid-row:auto}
}

/* Fenêtres */
.scrim{position:fixed;inset:0;background:rgba(18,32,29,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(900px,100%);max-height:92%;
  background:var(--char-2);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:0;
  z-index:11;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 10px;gap:12px}
.sheet-head h3{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,38px);margin:0}
.close{width:52px;height:52px;border-radius:50%;background:var(--char-3);font-size:26px;line-height:1;flex-shrink:0}
.sheet-body{overflow:auto;padding:6px 26px 18px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:14px 26px 22px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}
.cat{margin:16px 0 10px;color:var(--birch-dim);font-weight:600;font-size:16px}

.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px;margin-bottom:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;text-align:center}
.app-icon{position:relative;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;
  box-shadow:0 2px 0 rgba(18,32,29,.08), 0 8px 18px rgba(18,32,29,.12);transition:transform .12s ease}
.item:active .app-icon{transform:scale(.92)}
.item.sel .app-icon{outline:4px solid var(--ember);outline-offset:3px}
.app-icon svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-9px;right:-9px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;
  background:var(--ember);color:var(--birch);font-weight:700;font-size:16px;display:grid;place-items:center;border:3px solid var(--char-2)}
.app-minus{position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;background:var(--birch);color:var(--char-2);
  font-weight:700;font-size:20px;line-height:1;display:grid;place-items:center;border:3px solid var(--char-2)}
.app-name{font-weight:600;font-size:15px;line-height:1.2;max-width:120px}
.app-price{font-size:14px;color:var(--birch-dim)}

textarea,input,select{width:100%;font:inherit;color:var(--birch);background:var(--char);border:1px solid var(--line);border-radius:14px;padding:14px 16px;-webkit-user-select:text;user-select:text}
textarea{min-height:84px;resize:none}
label.f{display:block;margin:14px 0 6px;color:var(--birch-dim);font-size:15px;font-weight:600}
.btn{flex:1;min-height:64px;border-radius:18px;font-weight:700;font-size:19px;background:var(--ember);color:var(--birch);
  display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;padding:0 16px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--char-3);color:var(--birch)}
.btn.wine{background:var(--wine);color:#F6E3E7}
.btn.cheese{background:var(--cheese);color:var(--birch)}
.summary{flex:1;color:var(--birch-dim);font-size:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{padding:20px;border-radius:18px;background:var(--char-3);text-align:left;font-weight:600;border:1.5px solid transparent;min-height:72px}
.opt.sel{border-color:var(--ember);background:#E4ECCB}
.toggle{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px;border-radius:16px;background:var(--char-3);width:100%;text-align:left}
.toggle i{width:30px;height:30px;border-radius:9px;border:2px solid var(--birch-dim);flex-shrink:0;display:grid;place-items:center;font-style:normal;font-weight:700;color:transparent}
.toggle.sel i{background:var(--ember);border-color:var(--ember);color:var(--birch)}
.qr-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:12px;border-radius:16px;flex-shrink:0;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;width:190px!important;height:190px!important}
.qr.sm img,.qr.sm canvas{width:120px!important;height:120px!important}
.muted{color:var(--birch-dim)}
.lead{font-size:clamp(18px,2vw,22px);margin:0 0 14px}
.info-block{padding:18px 0;border-bottom:1px solid var(--line)}
.info-block:last-child{border-bottom:0}
.info-block h4{margin:0 0 6px;font-size:17px;color:var(--ember-deep)}
.info-block p{margin:0;white-space:pre-line}
.spotify{width:100%;height:380px;border:0;border-radius:16px;background:var(--char)}
.empty{padding:22px;border-radius:16px;background:var(--char-3);color:var(--birch-dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--char);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.card strong{font-size:19px}
.card .num{font-family:var(--display);font-size:26px;letter-spacing:.02em}
.hint{font-size:14px;color:var(--birch-dim);margin-top:6px}
.big-count{font-family:var(--display);font-size:clamp(48px,7vw,80px);line-height:1;margin:6px 0 10px;color:var(--birch)}

/* Messages */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 22px);transform:translate(-50%,-180%);z-index:30;
  background:var(--birch);color:var(--char);padding:18px 26px;border-radius:18px;font-weight:600;max-width:min(640px,92vw);
  box-shadow:0 10px 40px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.8,.2,1);text-align:center}
.toast.on{transform:translate(-50%,0)}
.toast.err{background:#F2C6C0;color:#4A1612}
.ack{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,200%);z-index:31;
  background:var(--ember);color:var(--birch);padding:22px 30px;border-radius:24px;font-weight:700;font-size:clamp(20px,2.4vw,26px);
  box-shadow:0 14px 40px rgba(18,32,29,.3);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;gap:14px;align-items:center;max-width:92vw}
.ack.on{transform:translate(-50%,0)}
.ack svg{width:34px;height:34px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.notice{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(18,32,29,.45);padding:24px}
.notice-box{background:var(--char-2);border-radius:28px;padding:34px;max-width:560px;text-align:center}
.notice-box h3{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,42px);margin:0 0 12px}
.notice-box p{margin:0 0 24px;font-size:20px}

/* Code et réglages */
.pin-dots{display:flex;gap:14px;justify-content:center;margin:10px 0 22px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--birch-dim)}
.pin-dots i.on{background:var(--ember);border-color:var(--ember)}
.keypad{display:grid;grid-template-columns:repeat(3,92px);gap:12px;justify-content:center}
.keypad button{height:72px;border-radius:18px;background:var(--char-3);font-size:28px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.brand p.welcome{font-family:var(--display);font-size:clamp(24px,3.3vw,40px);color:var(--ember-deep);line-height:1.15}
.idle{position:fixed;inset:0;z-index:9;background:var(--char);display:grid;grid-template-columns:1.1fr 1fr}
.idle-photo{background-size:cover;background-position:38% bottom;min-height:0}
.idle-content{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:clamp(24px,4vw,56px);gap:clamp(12px,2vw,22px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}
.idle-content img{width:clamp(130px,18vw,220px);height:auto}
.idle-content h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,58px);line-height:1;margin:0}
.idle-content .sub{color:var(--birch-dim);font-size:clamp(17px,1.9vw,22px);margin:-4px 0 0}
.idle-book{display:flex;align-items:center;gap:18px;background:var(--char-2);border:1px solid var(--line);border-radius:22px;padding:16px 22px;text-align:left}
.idle-book strong{display:block;font-size:20px}
.idle-book span{color:var(--birch-dim);font-size:15px}
.idle-clock{font-family:var(--display);font-size:clamp(30px,4vw,48px);color:var(--ember-deep)}
@media (orientation:portrait){ .idle{grid-template-columns:1fr;grid-template-rows:38% 1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Fenêtres ---------- */
let current = null;
function openSheet(name){
  closeSheet();
  const el = $("sh-" + name); if(!el) return;
  if(builders[name]) builders[name]();
  el.classList.add("on"); $("scrim").classList.add("on"); current = el;
}
function closeSheet(){ if(current){ current.classList.remove("on"); current = null; } $("scrim").classList.remove("on"); }
document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.open)));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
$("scrim").addEventListener("click", closeSheet);

/* ---------- Messages à l’écran ---------- */
let toastTimer, ackTimer;
function toast(msg, err){
  const el = $("toast"); el.textContent = msg; el.classList.toggle("err", !!err); el.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), err ? 6000 : 4200);
}
function showAck(kind){
  $("ackText").textContent = kind === "potato" ? t("ackPotato") : t("ack");
  $("ack").classList.add("on"); clearTimeout(ackTimer);
  ackTimer = setTimeout(() => $("ack").classList.remove("on"), 45000);
}
$("ack").addEventListener("click", () => $("ack").classList.remove("on"));

/* ---------- Notifications vers l’équipe (ntfy) ---------- */
const pending = {};
async function notify(title, message, opts = {}){
  if(!cfg.topic){ toast(t("errConfig"), true); return null; }
  const id = Math.random().toString(36).slice(2, 9);
  const who = session && session.group ? session.group + (session.people ? ` (${session.people} pers.)` : "") : "Clients";
  const body = {
    topic: cfg.topic,
    title: `${cfg.name} – ${title}`,
    message: `${message}\n\nGroupe : ${who}${lang !== "fr" ? `\nLangue des clients : ${lang.toUpperCase()}` : ""}`,
    priority: opts.priority || 3,
    tags: opts.tags || []
  };
  if(!opts.noAck) body.actions = [{ action:"http", label: opts.ackLabel || "On arrive", url:`${serverUrl()}/${cfg.topic}-retour`, method:"POST", body:id, clear:true }];
  try{
    const r = await fetch(serverUrl() + "/", { method:"POST", body: JSON.stringify(body) });
    if(!r.ok) throw new Error(r.status);
    pending[id] = opts.kind || "generic";
    return id;
  }catch(e){ toast(t("errSend"), true); return null; }
}
let es = null;
function listenAcks(){
  try{
    if(es) es.close();
    if(!cfg.topic || !("EventSource" in window)) return;
    es = new EventSource(`${serverUrl()}/${encodeURIComponent(cfg.topic)}-retour/sse`);
    es.onmessage = ev => {
      try{
        const d = JSON.parse(ev.data);
        if(d.event && d.event !== "message") return;
        const id = String(d.message || "").trim();
        const kind = pending[id]; delete pending[id];
        showAck(kind);
      }catch(e){}
    };
  }catch(e){}
}

};
function styleFor(cat){
  const c = (cat || "").toLowerCase();
  if(/grill|feu|charbon/.test(c)) return { g:"feu", bg:"#2E3A2A", fg:"#F0A04B" };
  if(/bulle|cr[ée]mant|champ/.test(c)) return { g:"bulles", bg:"#C9A64A", fg:"#FFF8E6" };
  if(/bi[èe]re/.test(c)) return { g:"biere", bg:"#D88F2E", fg:"#FFF6E8" };
  if(/sans|eau|soft/.test(c)) return { g:"eau", bg:"#4E8A8C", fg:"#EAF6F6" };
  return { g:"vin", bg:"#7A2638", fg:"#F6E3E7" };
}
function parseItems(){
  return (cfg.items || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(":");
    const cat = i > -1 ? l.slice(0, i).trim() : "";
    const list = (i > -1 ? l.slice(i + 1) : l).split(/;|,(?!\d)/).map(s => s.trim()).filter(Boolean);
    return { cat, list };
  });
}
function splitPrice(it){
  const m = it.match(/^(.*?)\s+[–-]\s+([\d.,]+\s*€)$/);
  return m ? { name:m[1], price:m[2] } : { name:it, price:"" };
}
function renderItems(){
  $("itemsList").innerHTML = parseItems().map(g => {
    const st = styleFor(g.cat);
    return `${g.cat ? `<div class="cat">${esc(trCat(g.cat))}</div>` : ""}
    <div class="apps">${g.list.map(it => {
      const q = basket[it] || 0, sp = splitPrice(it);
      return `<button class="item ${q ? "sel" : ""}" data-item="${esc(it)}">
        <span class="app-icon" style="background:${st.bg};color:${st.fg}">
          <svg viewBox="0 0 48 48" aria-hidden="true">${GLYPHS[st.g]}</svg>
          ${q ? `<span class="badge">${q}</span><span class="app-minus" data-minus="${esc(it)}" aria-label="−1">−</span>` : ""}
        </span>
        <span class="app-name">${esc(trItem(sp.name))}</span>
        ${sp.price ? `<span class="app-price">${esc(sp.price)}</span>` : ""}
      </button>`;
    }).join("")}</div>`;
  }).join("");
  const n = Object.values(basket).reduce((a, b) => a + b, 0);
  $("manqueSummary").textContent = n ? Object.entries(basket).map(([k, v]) => `${v} × ${trItem(splitPrice(k).name)}`).join(", ") : t("summaryEmpty");
  $("manqueSend").disabled = !n && !$("manqueNote").value.trim();
}
$("itemsList").addEventListener("click", e => {
  const m = e.target.closest("[data-minus]");
  if(m){ e.stopPropagation(); const k = m.dataset.minus; basket[k]--; if(basket[k] <= 0) delete basket[k]; renderItems(); return; }
  const c = e.target.closest("[data-item]");
  if(c){ const k = c.dataset.item; basket[k] = (basket[k] || 0) + 1; renderItems(); }
});
$("manqueNote").addEventListener("input", renderItems);
$("manqueSend").addEventListener("click", async () => {
  const lines = Object.entries(basket).map(([k, v]) => `• ${v} × ${k}`);
  const note = $("manqueNote").value.trim();
  if(note) lines.push(`• ${note}`);
  $("manqueSend").disabled = true;
  if(await notify("Il manque…", lines.join("\n"), { tags:["fire"] })){
    basket = {}; $("manqueNote").value = ""; closeSheet(); toast(t("sentManque"));
  } else renderItems();
});

/* ---------- Raclette : pommes de terre ---------- */
function fmtLeft(ms){ const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function updateRaclette(){
  const on = !!(session && session.raclette);
  $("tileRaclette").hidden = !on; $("grid").classList.toggle("has-raclette", on);
  if(!on) return;
  const left = (session.potatoUntil || 0) - Date.now();
  const waiting = left > 0;
  $("racletteSub").textContent = waiting ? t("potatoCount", {t:fmtLeft(left)}) : t("racletteS", {n:cfg.potato});
  if(current && current.id === "sh-raclette"){
    $("potatoState").innerHTML = waiting
      ? `<p class="lead">${esc(t("potatoWait"))}</p><div class="big-count">${fmtLeft(left)}</div>`
      : (session.potatoUntil && -left < 15 * 60000 ? `<p class="lead">${esc(t("potatoSoon"))}</p>` : "") + `<p class="lead">${esc(t("potatoIntro", {n:cfg.potato}))}</p>`;
    $("potatoSend").disabled = waiting;
  }
}
$("potatoSend").addEventListener("click", async () => {
  const n = Number(cfg.potato) || 15;
  const at = new Date(Date.now() + n * 60000);
  $("potatoSend").disabled = true;
  if(await notify("Pommes de terre (raclette)", `À apporter vers ${hhmm(at)}, dans ${n} minutes`, { priority:4, tags:["potato"], kind:"potato", ackLabel:"C’est parti" })){
    session.potatoUntil = at.getTime(); saveSession(); closeSheet(); toast(t("potatoSent", {n})); updateRaclette();
  } else $("potatoSend").disabled = false;
});

/* ---------- Addition ---------- */
const PAY_FR = { card:"Carte bancaire", cash:"Espèces", later:"Pas encore décidé" };
let pay = null, split = false, lastBill = 0;
$("payOpts").addEventListener("click", e => {
  const o = e.target.closest("[data-pay]"); if(!o) return;
  pay = o.dataset.pay;
  document.querySelectorAll("#payOpts .opt").forEach(x => x.classList.toggle("sel", x === o));
});
$("splitToggle").addEventListener("click", () => { split = !split; $("splitToggle").classList.toggle("sel", split); });
$("additionSend").addEventListener("click", async () => {
  if(Date.now() - lastBill < 3 * 60000){ closeSheet(); toast(t("billAgain")); return; }
  const msg = `Paiement : ${pay ? PAY_FR[pay] : "non précisé"}${split ? "\nAddition à partager" : ""}`;
  if(await notify("Demande d’addition", msg, { priority:4, tags:["receipt"] })){
    lastBill = Date.now(); closeSheet(); toast(t("billSent"));
  }
});

/* ---------- Appeler l’équipe ---------- */
const lines = txt => (txt || "").split("\n").map(x => x.trim()).filter(Boolean);
function helpList(){
  const fr = lines(cfg.help);
  const loc = lang === "de" ? lines(cfg.helpDe) : lang === "en" ? lines(cfg.helpEn) : fr;
  return fr.map((r, i) => ({ fr:r, label: loc[i] || r }));
}
function renderHelp(){
  $("helpOpts").innerHTML = helpList().map((h, i) => `<button class="opt" data-help="${i}">${esc(h.label)}</button>`).join("");
}
$("helpOpts").addEventListener("click", async e => {
  const o = e.target.closest("[data-help]"); if(!o) return;
  o.classList.add("sel");
  if(await notify("Besoin d’aide", (helpList()[+o.dataset.help] || {}).fr || o.textContent, { priority:4, tags:["bell"] })){
    closeSheet(); toast(t("helpSent"));
  } else o.classList.remove("sel");
});

/* ---------- Musique ---------- */
function spotifyEmbed(url){
  const m = (url || "").match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(playlist|album|artist|show)\/([A-Za-z0-9]+)/);
  return m ? `https://open.spotify.com/embed/${m[1]}/${m[2]}?theme=0` : null;
}
function renderMusic(){
  const src = spotifyEmbed(cfg.spotify);
  $("musicBody").innerHTML = src
    ? `<iframe class="spotify" src="${src}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
       <a class="btn ghost" href="${esc(cfg.spotify)}" target="_blank" rel="noopener" style="margin-top:14px">${esc(t("openSpotify"))}</a>
       <p class="hint">${esc(t("musicHint"))}</p>`
    : `<div class="empty">${esc(t("noPlaylist"))}</div>`;
}

/* ---------- QR codes ---------- */
function makeQr(el, text){
  if(!el) return;
  if(typeof QRCode === "undefined"){ el.outerHTML = `<p class="muted">${esc(text)}</p>`; return; }
  new QRCode(el, { text, width:400, height:400, correctLevel: QRCode.CorrectLevel.M });
}

/* ---------- Avis ---------- */
function renderReview(){
  const w = $("reviewWrap");
  if(!cfg.review){ w.innerHTML = `<div class="empty">${esc(t("noReview"))}</div>`; return; }
  w.innerHTML = `<div class="qr" id="reviewQr"></div>
    <div style="flex:1;min-width:220px"><p style="margin:0 0 8px;font-size:22px">${esc(t("reviewScan"))}</p>
    <p class="muted" style="margin:0">${esc(t("reviewSmall"))}</p></div>`;
  makeQr($("reviewQr"), cfg.review);
}
$("noteSend").addEventListener("click", async () => {
  const n = $("privateNote").value.trim();
  if(!n){ $("privateNote").focus(); return; }
  if(await notify("Message des clients", n, { tags:["speech_balloon"], noAck:true })){
    $("privateNote").value = ""; closeSheet(); toast(t("privSent"));
  }
});


function renderLinks(){
  const links = [["book", cfg.book], ["gift", cfg.gift], ["insta", cfg.insta]].filter(l => l[1]);
  if(!links.length){ $("linksList").innerHTML = `<div class="empty">${esc(t("noLinks"))}</div>`; return; }
  $("linksList").innerHTML = `<div class="cards">${links.map(([k]) => `
    <div class="card"><strong>${esc(t("l_" + k))}</strong><div class="qr sm" id="linkQr_${k}"></div></div>`).join("")}</div>`;
  links.forEach(([k, url]) => makeQr($("linkQr_" + k), url));
}

/* ---------- Infos ---------- */
function renderInfos(){
  let html = "";
  if(cfg.wifi){
    html += `<div class="info-block"><h4>${esc(t("wifi"))}</h4><div class="qr-wrap"><div class="qr sm" id="wifiQr"></div>
      <div><p style="font-size:22px">${esc(cfg.wifi)}</p><p class="muted">${esc(t("password"))} : ${esc(cfg.wifiPass || t("none"))}</p>
      <p class="hint">${esc(t("scanWifi"))}</p></div></div></div>`;
  }
  if(cfg.end) html += `<div class="info-block"><h4>${esc(t("endT"))}</h4><p>${esc(cfg.end)}</p></div>`;
  const text = lang === "de" ? (cfg.infosDe || cfg.infos) : lang === "en" ? (cfg.infosEn || cfg.infos) : cfg.infos;
  (text || "").split(/\n(?=#)/).forEach(b => {
    const s = b.trim(); if(!s) return;
    const lines = s.split("\n");
    const title = lines[0].startsWith("#") ? lines.shift().replace(/^#\s*/, "") : "";
    html += `<div class="info-block">${title ? `<h4>${esc(title)}</h4>` : ""}<p>${esc(lines.join("\n").trim())}</p></div>`;
  });
  $("infosBody").innerHTML = html || `<div class="empty">${esc(t("noInfo"))}</div>`;
  if(cfg.wifi){
    const w = s => String(s).replace(/([\\;,:"])/g, "\\$1");
    makeQr($("wifiQr"), `WIFI:T:${cfg.wifiPass ? "WPA" : "nopass"};S:${w(cfg.wifi)};P:${w(cfg.wifiPass)};;`);
  }
}

/* ---------- Rappel de fin de soirée ---------- */
function endDate(){
  const m = (cfg.end || "").match(/(\d{1,2})\s*[h:.]\s*(\d{0,2})/i); if(!m) return null;
  const d = new Date(); d.setHours(+m[1], +(m[2] || 0), 0, 0);
  if(+m[1] < 6 && new Date().getHours() >= 12) d.setDate(d.getDate() + 1);
  return d;
}
function checkEnd(){
  if(!session || session.warned) return;
  const e = endDate(); if(!e) return;
  const left = e - Date.now();
  if(left <= 30 * 60000 && left > -5 * 60000){
    session.warned = true; saveSession(); closeSheet(); $("notice").hidden = false;
  }
}
$("noticeOk").addEventListener("click", () => { $("notice").hidden = true; });

/* ---------- Accès équipe : appui long sur le nom ---------- */
let pressT, pin = "";
const brand = $("kotaName");
brand.addEventListener("pointerdown", () => { pressT = setTimeout(() => { pin = ""; openSheet("pin"); }, 2500); });
["pointerup","pointerleave","pointercancel"].forEach(ev => brand.addEventListener(ev, () => clearTimeout(pressT)));
const idleLogo = $("idleLogo");
idleLogo.addEventListener("pointerdown", () => { pressT = setTimeout(() => { pin = ""; openSheet("pin"); }, 2500); });
["pointerup","pointerleave","pointercancel"].forEach(ev => idleLogo.addEventListener(ev, () => clearTimeout(pressT)));
idleLogo.addEventListener("contextmenu", e => e.preventDefault());
function renderPin(){ document.querySelectorAll("#pinDots i").forEach((d, i) => d.classList.toggle("on", i < pin.length)); }
$("keypad").innerHTML = ["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k => k ? `<button data-k="${k}">${k}</button>` : "<span></span>").join("");
$("keypad").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if(!b) return;
  pin = b.dataset.k === "⌫" ? pin.slice(0, -1) : (pin + b.dataset.k).slice(0, 4);
  renderPin();
  if(pin.length === 4){
    if(pin === String(cfg.pin)) setTimeout(() => openSheet("admin"), 150);
    else { toast("Code incorrect.", true); pin = ""; setTimeout(renderPin, 300); }
  }
});

function normNtfy(topic, server){
  let tp = (topic || "").trim(), s = (server || "").trim();
  const fromUrl = v => v.match(/^(?:https?:\/\/)?([^\/\s]+\.[^\/\s]+)\/([A-Za-z0-9_-]+)\/?$/);
  const m = fromUrl(tp) || (!tp ? fromUrl(s) : null);
  if(m){ tp = m[2]; s = m[1]; }
  s = s ? "https://" + s.replace(/^https?:\/\//, "").split("/")[0] : "https://ntfy.sh";
  return { topic: tp, server: s };
}
let racletteToggle = false;
$("sRaclette").addEventListener("click", () => { racletteToggle = !racletteToggle; $("sRaclette").classList.toggle("sel", racletteToggle); });
function fillAdmin(){
  $("sGroup").value = session?.group || ""; $("sWelcome").value = session?.welcome || ""; $("sPeople").value = session?.people || "";
  racletteToggle = !!session?.raclette; $("sRaclette").classList.toggle("sel", racletteToggle);
  $("cTopic").value = cfg.topic; $("cServer").value = cfg.server; $("cName").value = cfg.name; $("cPotato").value = cfg.potato;
  $("cItems").value = cfg.items; $("cHelp").value = cfg.help; $("cHelpDe").value = cfg.helpDe; $("cHelpEn").value = cfg.helpEn; $("cSpotify").value = cfg.spotify; $("cReview").value = cfg.review;
  $("cBook").value = cfg.book; $("cGift").value = cfg.gift; $("cPhoto").value = cfg.photo || ""; $("cInsta").value = cfg.insta;
  $("cWifi").value = cfg.wifi; $("cWifiPass").value = cfg.wifiPass; $("cEnd").value = cfg.end;
  $("cInfos").value = cfg.infos; $("cInfosDe").value = cfg.infosDe; $("cInfosEn").value = cfg.infosEn; $("cPin").value = cfg.pin;
}
$("cfgSave").addEventListener("click", () => {
  const p = $("cPin").value.trim();
  if(!/^\d{4}$/.test(p)){ toast("Le code doit faire 4 chiffres.", true); return; }
  cfg = Object.assign(cfg, {
    name:$("cName").value.trim() || "Le kota", ...normNtfy($("cTopic").value, $("cServer").value),
    pin:p, potato: Math.max(1, parseInt($("cPotato").value, 10) || 15),
    items:$("cItems").value, help:$("cHelp").value, helpDe:$("cHelpDe").value, helpEn:$("cHelpEn").value, spotify:$("cSpotify").value.trim(), review:$("cReview").value.trim(),
    book:$("cBook").value.trim(), gift:$("cGift").value.trim(), photo:$("cPhoto").value.trim(), insta:$("cInsta").value.trim(),
    wifi:$("cWifi").value.trim(), wifiPass:$("cWifiPass").value, end:$("cEnd").value.trim(),
    infos:$("cInfos").value, infosDe:$("cInfosDe").value, infosEn:$("cInfosEn").value
  });
  store("kota_cfg", cfg); listenAcks(); applyLang(); closeSheet(); toast("Réglages enregistrés.");
});
$("testSend").addEventListener("click", async () => {
  Object.assign(cfg, normNtfy($("cTopic").value, $("cServer").value));
  $("cTopic").value = cfg.topic; $("cServer").value = cfg.server; listenAcks();
  if(await notify("Test", "La tablette du kota est bien reliée. Touchez « On arrive » pour tester la réponse.", { tags:["white_check_mark"] }))
    toast("Notification de test envoyée.");
});
$("sessionStart").addEventListener("click", () => {
  session = { group:$("sGroup").value.trim(), people:$("sPeople").value.trim(), welcome:$("sWelcome").value.trim(), raclette:racletteToggle, start:Date.now(), warned:false, potatoUntil:0 };
  saveSession(); basket = {}; lastBill = 0; lang = "fr"; closeSheet(); applyLang();
  toast("Soirée ouverte. Bonne soirée à eux !");
});
$("sessionEnd").addEventListener("click", () => {
  session = null; saveSession(); basket = {}; lastBill = 0; lang = "fr";
  $("privateNote").value = ""; $("manqueNote").value = ""; $("notice").hidden = true; closeSheet(); applyLang();
  toast("Soirée clôturée.");
});

const builders = {
  manque: renderItems, raclette: updateRaclette, aide: renderHelp, musique: renderMusic, avis: renderReview,
  revenir: renderLinks, infos: renderInfos, pin: renderPin, admin: fillAdmin,
  addition: () => { pay = null; split = false; $("splitToggle").classList.remove("sel");
    document.querySelectorAll("#payOpts .opt").forEach(x => x.classList.remove("sel")); }
};

/* ---------- Écran allumé, retour à l’accueil, minuteries ---------- */
let wakeLock = null;
async function keepAwake(){ try{ if("wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } }catch(e){} }
document.addEventListener("pointerdown", keepAwake);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible"){ keepAwake(); listenAcks(); } });
let idleT;
const resetIdle = () => { clearTimeout(idleT); idleT = setTimeout(() => { if(current && current.id !== "sh-admin") closeSheet(); }, 3 * 60000); };
["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, resetIdle));
setInterval(() => { updateRaclette(); checkEnd(); }, 1000);

applyLang();
listenAcks();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js", { updateViaCache:"none" }).then(r => r.update()).catch(() => {}); }
</script>
</body>
